<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo - Acerte a Toupeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&amp;display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/jogo.css">
</head>
<body>
    <div id="pagina-jogo" class="pagina-jogo">
        <aside class="lateral">
            <div class="perfil">
                <div class="avatar"></div>
                <div>
                    <p class="nome-jogador">Nome Usu.</p>
                    <a class="link-sair" href="index.html">Sair</a>
                </div>
                <a class="engrenagem" href="alterar-cadastro.html" aria-label="Alterar cadastro" title="Alterar cadastro">&#9881;</a>
            </div>

            <section class="opcoes">
                <h2 class="titulo-opcoes">OPÇÕES DE JOGO</h2>

                <div class="opcao">
                    <p class="rotulo-opcao">QUANTIA DE<br>TOUPEIRAS</p>
                    <div class="contador">
                        <span id="quantia-toupeiras" class="numero-toupeiras">20</span>
                        <div class="setas">
                            <button type="button" id="botao-aumentar" class="seta" aria-label="Aumentar quantia de toupeiras">&#8593;</button>
                            <button type="button" id="botao-diminuir" class="seta" aria-label="Diminuir quantia de toupeiras">&#8595;</button>
                        </div>
                    </div>
                </div>

                <div class="opcao">
                    <p class="rotulo-opcao">TABULEIRO</p>
                    <div class="dimensoes">
                        <input class="campo-dimensao" type="number" id="linhas" name="linhas" placeholder="Linhas" aria-label="Linhas do tabuleiro" min="2" max="8" value="6">
                        <span class="vezes">×</span>
                        <input class="campo-dimensao" type="number" id="colunas" name="colunas" placeholder="Colunas" aria-label="Colunas do tabuleiro" min="2" max="8" value="4">
                    </div>
                </div>

                <!-- Durante a partida o jogo.js troca o texto de COMEÇAR para DESISTIR -->
                <button type="button" id="botao-comecar" class="botao-azul botao-largo">COMEÇAR</button>
                <button type="button" id="botao-recomecar" class="botao-azul botao-largo">RECOMEÇAR</button>
            </section>

            <div class="modos">
                <button type="button" id="botao-classico" class="botao-azul botao-modo botao-classico">MODO<br>CLÁSSICO</button>
                <button type="button" id="botao-explosivo" class="botao-azul botao-modo botao-explosivo selecionado">MODO<br>EXPLOSIVO</button>
                <a class="botao-azul botao-ranking" href="ranking.html">RANKING<br>GLOBAL</a>
            </div>
        </aside>

        <main class="area-jogo">
            <header class="placar">
                <div class="placar-dados">
                    <span>Pontuação:</span>
                    <span id="pontuacao">00</span>
                    <span>% Acertos:</span>
                    <span id="porcentagem-acertos">00</span>
                    <span class="meta">Meta da fase:</span>
                    <span id="meta" class="meta">70%</span>
                </div>

                <h1 id="titulo-modo" class="titulo-modo titulo-explosivo">MODO <span id="nome-modo" class="nome-modo">EXPLOSIVO</span></h1>

                <div class="placar-dados placar-direita">
                    <span>Fase:</span>
                    <span id="fase">00</span>
                    <span>Tempo:</span>
                    <span id="tempo">00</span>
                </div>
            </header>

            <!-- Os buracos são criados pelo jogo.js de acordo com as linhas e colunas escolhidas -->
            <div id="tabuleiro" class="tabuleiro"></div>

            <div id="aviso" class="aviso escondido" aria-live="polite">
                <p id="texto-aviso" class="texto-aviso"></p>
                <div id="botoes-aviso" class="botoes-aviso">
                    <button type="button" id="botao-nova-partida" class="botao-aviso">NOVA PARTIDA</button>
                    <button type="button" id="botao-fechar-aviso" class="botao-aviso">FECHAR</button>
                </div>
            </div>
        </main>
    </div>

    <section id="historico" class="historico">
        <h2 class="titulo-historico">Histórico de partidas</h2>
        <table class="tabela-historico">
            <thead>
                <tr>
                    <th>Jogador</th>
                    <th>Tabuleiro</th>
                    <th>Modalidade</th>
                    <th>Pontuação</th>
                    <th>Nível</th>
                    <th>Data/Hora</th>
                </tr>
            </thead>
            <!-- As partidas são adicionadas pelo jogo.js; sem back-end, o histórico some ao recarregar a página -->
            <tbody id="corpo-historico">
                <tr id="linha-vazia">
                    <td colspan="6">Nenhuma partida jogada ainda.</td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="js/jogo.js"></script>
</body>
</html>
