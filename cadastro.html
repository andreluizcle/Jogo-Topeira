<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Acerte a Toupeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&amp;display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <main class="cartao cartao-grande">
        <h1 class="titulo titulo-grande">CADASTRO</h1>

        <form id="formulario-cadastro" class="formulario-cadastro">
            <div class="linha-dupla">
                <input class="campo" type="text" id="nome-completo" name="nome-completo" placeholder="Nome Completo" aria-label="Nome Completo" required>
                <input class="campo" type="text" id="username" name="username" placeholder="Username" aria-label="Username" required>
            </div>

            <div class="linha-dupla">
                <input class="campo" type="email" id="email" name="email" placeholder="E-mail" aria-label="E-mail" required>
                <input class="campo" type="tel" id="telefone" name="telefone" placeholder="Telefone" aria-label="Telefone" required>
            </div>

            <div class="linha-dupla linha-data">
                <div class="data-nascimento">
                    <p class="rotulo-data">Data de Nascimento</p>
                    <div class="campos-data">
                        <input class="campo campo-data" type="text" inputmode="numeric" id="dia" name="dia" placeholder="DD" aria-label="Dia de nascimento" maxlength="2" pattern="[0-9]{2}" required>
                        <input class="campo campo-data" type="text" inputmode="numeric" id="mes" name="mes" placeholder="MM" aria-label="Mês de nascimento" maxlength="2" pattern="[0-9]{2}" required>
                        <input class="campo campo-data" type="text" inputmode="numeric" id="ano" name="ano" placeholder="AAAA" aria-label="Ano de nascimento" maxlength="4" pattern="[0-9]{4}" required>
                    </div>
                </div>
                <input class="campo" type="text" inputmode="numeric" id="cpf" name="cpf" placeholder="CPF" aria-label="CPF" maxlength="14" required>
            </div>

            <div class="linha-dupla">
                <input class="campo" type="password" id="senha" name="senha" placeholder="Senha" aria-label="Senha" required>
                <input class="campo" type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirmar Senha" aria-label="Confirmar Senha" required>
            </div>

            <div>
                <button class="botao-rosa botao-grande" type="submit">CONFIRMAR CADASTRO</button>
                <p id="mensagem-erro" class="mensagem-erro"></p>
            </div>
        </form>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
