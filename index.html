<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acerte a Toupeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&amp;display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="cartao cartao-login">
        <h1 class="titulo titulo-login">LOGIN</h1>

        <form id="formulario-login" class="formulario-login">
            <input class="campo" type="text" id="usuario" name="usuario" placeholder="Usuário" aria-label="Usuário" required>
            <input class="campo campo-senha" type="password" id="senha" name="senha" placeholder="Senha" aria-label="Senha" required>
            <button class="botao-rosa botao-login" type="submit">Login</button>
        </form>

        <hr class="divisoria">

        <h2 class="subtitulo-login">Não tem cadastro?</h2>
        <a class="botao-rosa botao-login" href="cadastro.html">Cadastre-se</a>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
